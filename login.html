<body class="login-page">
    <nav>
        <img src="./images/logotyp.webp" alt="Логотип" class="logo">

        </ul>
    </nav>

    <main>
        <div class="auth-box">
            <div class="auth-tabs">
                <button type="button" id="tab-login" class="auth-tab" onclick="showTab('login')">Увійти</button>
                <button type="button" id="tab-register" class="auth-tab active" onclick="showTab('register')">Створити
                    акаунт</button>
            </div>

            <div id="auth-message" class="auth-message"></div>

            <form id="login-form" class="login-form" style="display: none;">
                <h2>Вхід</h2>
                <input type="text" id="login-name" placeholder="Ваше ім’я" required autocomplete="username">
                <input type="password" id="login-password" placeholder="Пароль" required
                    autocomplete="current-password">
                <br>
                <button type="submit">Увійти</button>
            </form>

            <form id="register-form" class="login-form">
                <h2>Створити акаунт</h2>
                <input type="text" id="reg-name" placeholder="Ваше ім’я" required autocomplete="username">
                <input type="password" id="reg-password" placeholder="Пароль (мін. 4 символи)" required minlength="4"
                    autocomplete="new-password">
                <input type="password" id="reg-password2" placeholder="Підтвердіть пароль" required minlength="4"
                    autocomplete="new-password">

                <div class="photo-upload">
                    <label for="reg-photo">Фото профілю (необов’язково)</label>
                    <input type="file" id="reg-photo" accept="image/*">
                    <img id="photo-preview" alt="Прев’ю" style="display:none;">
                </div>

                <br>
                <button type="submit">Зареєструватися</button>
            </form>
        </div>
    </main>
